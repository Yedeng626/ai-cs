[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ---- Go 后端 (:8080) ----
[program:backend]
command=/app/backend
directory=/app
environment=APP_PROFILE="docker",SERVER_HOST="0.0.0.0",SERVER_PORT="8080",GIN_MODE="release"
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---- Next.js 前端 (:3000) ----
[program:frontend]
command=npm start
environment=PORT="3000"
directory=/app/frontend
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---- BGE Embedding (:8088) ----
# startsecs=30 因为 PyTorch 加载模型需要时间
[program:bge]
command=python /app/serve.py
autorestart=true
startsecs=30
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---- Nginx (:80) ----
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
